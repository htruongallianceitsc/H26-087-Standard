name: Catalog quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python3 tools/standard_tool.py validate
      - run: python3 tools/standard_tool.py lint-content
      - run: python3 tools/standard_tool.py test-profiles
      - run: python3 tools/standard_tool.py generate --check
